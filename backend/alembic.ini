[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: sqlalchemy.url is intentionally NOT set here.
# It is injected at runtime by alembic/env.py from the shared app config
# (app.core.config.Settings) to guarantee a single source of truth and to
# avoid ConfigParser %-interpolation mangling URL-encoded passwords.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
