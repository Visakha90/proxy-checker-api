upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_guest:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# ─── OPTIONAL IP ALLOWLIST ──────────────────────────────────────────────
# Uncomment and add your team's IPs to restrict access.
# When enabled, only listed IPs can reach the platform.
# geo $allowed_ip {
#     default        0;
#     127.0.0.1      1;
#     10.0.0.0/8     1;
#     172.16.0.0/12  1;
#     192.168.0.0/16 1;
#     # Add team IPs below:
#     # 203.0.113.50   1;  # Office
#     # 198.51.100.0/24 1; # VPN range
# }

server {
    listen 80;
    server_name _;

    # ─── IP Allowlist enforcement (uncomment to activate) ───
    # if ($allowed_ip = 0) {
    #     return 403;
    # }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/csv application/json text/css application/javascript;
    gzip_min_length 256;
    gzip_comp_level 5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Public API v1 - rate limited at nginx level for guests
    location /api/v1/ {
        limit_req zone=api_guest burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-API-Key, Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Backend API
    location /api/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Health and metrics (no rate limit)
    location /health {
        proxy_pass http://backend;
    }

    location /ready {
        proxy_pass http://backend;
    }

    location /metrics {
        proxy_pass http://backend;
        # Restrict to internal/monitoring only in production
        # allow 10.0.0.0/8;
        # deny all;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://backend;
    }

    location /openapi.json {
        proxy_pass http://backend;
    }

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend HMR WebSocket
    location /_next/webpack-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
